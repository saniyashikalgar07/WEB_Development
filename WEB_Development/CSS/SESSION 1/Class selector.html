<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASS SELECTOR</title>
    <style>
        .multiple{
            background-color: rgb(142, 231, 231);
            font-size: 20px;
        }
        .uniq{
               font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        
    </style>
</head>
<body>
    <h3>CLASS SELECTOR</h3>
    <p class="multiple uniq">Lorem ipsum dolor sit amet consectetur.</p>
    <pre class="multiple">Lorem ipsum dolor sit amet consectetur.</pre>
    <h5 class="multiple">Lorem ipsum dolor sit amet consectetur.</h5>
    <span class="multiple uniq">Lorem ipsum dolor sit amet consectetur.</span>
</body>
</html>
