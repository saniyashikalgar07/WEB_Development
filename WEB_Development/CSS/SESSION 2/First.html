<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First letter style</title>
    <style>
        h3::first-letter{
            color: crimson;
            font-size: 30px;
            font-style: oblique;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        p::first-line{
            color: rgb(28, 34, 209);
            background-color: darksalmon;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
        }
        p::selection{
            background-color: yellow;
            color :red;
        
        }
    </style>
</head>
<body>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quos saepe eligendi nesciunt reprehenderit ab facilis magni velit laudantium! Animi nemo placeat omnis cumque exercitationem aspernatur dolores nobis cupiditate neque perferendis.</p>
    <h3>Lorem, ipsum dolor.</h3>
    <h3>Lorem, ipsum.</h3>
    <h3>Hello</h3>
</body>
</html>
