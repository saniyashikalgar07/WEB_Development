<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stucture pseudo class</title>
    <style>
        /* Create a list and use :nth-child() to:
         Apply different color to even list items 
        */
       li:first-child{
        color:aqua;
       }
        li:last-child{
            color: blueviolet;
        }
        tr:nth-child(even){
            color: red;
            background-color: black;
        }
        tr:nth-child(odd){
            color: rgb(203, 91, 12);
            background-color: rgb(220, 173, 183);
        }
    </style>
</head>
<body>
    <ul>
        <li>THAR</li>
        <li>Maruti Swift</li>
        <li>KTM</li>
        <li>Hero</li>
    </ul>
    <table style="border: 3px solid red;" border="1">
        <tr>
            <td>Row 1 data 1</td>
            <td>Row 1 data 2</td>
            <td>Row 1 data 3</td>
        </tr>
        <tr>
            <td>Row 1 data 1</td>
            <td>Row 1 data 2</td>
            <td>Row 1 data 3</td>
        </tr>
        <tr>
            <td>Row 1 data 1</td>
            <td>Row 1 data 2</td>
            <td>Row 1 data 3<Row 1 data 1/td>
        </tr>
        <tr>
            <td>Row 1 data 1</td>
            <td>Row 1 data 1</td>
            <td>Row 1 data 3</td>
        </tr>
    </table>
</body>
</html>
