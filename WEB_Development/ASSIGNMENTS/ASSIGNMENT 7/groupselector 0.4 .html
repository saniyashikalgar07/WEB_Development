<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>group selector</title>
</head>
<style>
    /* Write a program that uses a grouping selector to apply same color to: 
          <h1> 
          <h2 
*/
h1 ,h2{
    color: aqua;
    background-color: rgb(147, 147, 220);
}
</style>
<body>
    <h1>Hey I Am Riya...</h1>
    <h2>Hi Am Diya....</h2>
</body>
</html>
