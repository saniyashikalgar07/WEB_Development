<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element selector in html</title>
</head>
<style>
    p{
        color: red;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bolder;
        background-color: aqua;
    }
    h1{
        color: red;
        background-color: black;
        /* font-weight: bold; */
        font-style:oblique;
        font-variant:normal;
        font-size:50px;
    }
</style>
<body>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam, expedita.</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas, cumque.</p>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Maiores, molestiae.</p>
    <h1>HELLO</h1>
    <h1>GOOD</h1>
    <h1>HEY....</h1>
</body>
</html>
