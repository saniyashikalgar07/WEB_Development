<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOR FORMAT</title>
    <style>
        /* HEX EXAMPLE */
        .main{
        
            color:#ff0000;
            background-color: black;
            font-size: 30px;
        }
        /* RED */
        .code{
            color: rgb(255,0,0);
            background-color: yellow;
        }
        .hero{
            color: rgba(175, 28, 28, 0.6);
        }

    </style>
</head>
<body>
    <div class="main">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Tenetur, harum!</div>
    <h2 class="code">HELLO</h2>
    <h1 class="hero">Hey....Good morning</h1>
</body>
</html>
