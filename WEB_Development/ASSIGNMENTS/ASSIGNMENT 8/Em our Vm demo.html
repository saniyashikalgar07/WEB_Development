<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            font-size: 30px;
            border: 4px solid salmon;
            color: red;
            background-color: black;
            padding: 5px;
        }
        .child{
            font-size: 2em;
            border: 3px solid red;
            color: blue;
            background-color: yellow;
        }
        .main{
            font-size: 2rem;
            border: 3px solid red;
            background-color: black;
            color: white;
            margin: 10px;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="parent">
          fount size=20px....
        <div class="child">font size=2em</div>
    </div>
     <div class="main"> font size = 2rem</div>

</body>
</html>
